<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

  body { width: 650px; height: 400px; }

  .card {
    width: 650px;
    height: 400px;
    background: #fff;
    border: 6px solid #1a7a1a;
    border-radius: 18px;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Vertical red banner on the left edge */
  .side-banner {
    width: 34px;
    background: #1a7a1a;
    color: #d21f1f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-banner span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 3px;
    background: #fff;
    padding: 6px 4px;
    border-radius: 6px;
  }

  .content {
    flex: 1;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid #1a7a1a;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .header img.logo { width: 55px; height: 55px; object-fit: contain; }
  .header .titles { font-size: 11px; font-weight: bold; line-height: 1.3; text-align: center; flex: 1; }

  .body-row { display: flex; gap: 16px; flex: 1; }

  .photo-col { width: 130px; text-align: center; }
  .photo-col img.photo {
    width: 120px;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #1a7a1a;
  }

  .fields { flex: 1; font-size: 14px; }
  .fields .name { font-size: 17px; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
  .fields .row { display: flex; margin-bottom: 3px; }
  .fields .label { width: 65px; font-weight: bold; }
  .fields .value { flex: 1; }

  .footer-seal {
    position: absolute;
    bottom: 10px;
    left: 44px;
    width: 40px;
    height: 40px;
    opacity: 0.9;
  }

  .qr-code {
    position: absolute;
    bottom: 10px;
    right: 18px;
    width: 50px;
    height: 50px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="side-banner"><span>STUDENT IDENTIFICATION CARD</span></div>
    <div class="content">
      <div class="header">
        <img class="logo" src="{{LOGO}}" />
        <div class="titles">
          MINISTRY OF EDUCATION STATE DEPARTMENT<br>
          FOR VOCATIONAL AND TECHNICAL TRAINING<br>
          NORTH HORR TECHNICAL &amp; VOCATIONAL COLLEGE
        </div>
      </div>
      <div class="body-row">
        <div class="photo-col">
          <img class="photo" src="{{PHOTO}}" />
        </div>
        <div class="fields">
          <div class="name">{{NAME}}</div>
          <div class="row"><div class="label">Adm No:</div><div class="value">{{ADM_NO}}</div></div>
          <div class="row"><div class="label">Dept:</div><div class="value">{{DEPT}}</div></div>
          <div class="row"><div class="label">Course:</div><div class="value">{{COURSE}}</div></div>
          <div class="row"><div class="label">Gender:</div><div class="value">{{GENDER}}</div></div>
          <div class="row"><div class="label">ID No:</div><div class="value">{{ID_NO}}</div></div>
          <div class="row"><div class="label">Expiry:</div><div class="value">{{EXPIRY}}</div></div>
        </div>
      </div>
      <img class="footer-seal" src="{{SEAL}}" />
      <img class="qr-code" src="{{QR_CODE}}" />
    </div>
  </div>
</body>
</html>
