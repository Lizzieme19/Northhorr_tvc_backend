<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

  body { width: 650px; height: 400px; }

  .card {
    width: 650px;
    height: 400px;
    background: #fff;
    border: 4px solid #1a7a3d;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .content {
    flex: 1;
    padding: 14px 18px 0 18px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---- Header: coat of arms (left) + titles (center) + college seal (right) ---- */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .header img.logo {
    width: 62px;
    height: 62px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .header .titles {
    flex: 1;
    min-width: 0;
    text-align: center;
    color: #1a1a1a;
  }
  .header .titles .ministry-line {
    font-size: 11.5px;
    font-weight: bold;
    line-height: 1.35;
  }
  .header .titles .college-name {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    margin-top: 4px;
  }

  /* ---- Name: its own full-width row ---- */
  .name {
    font-size: 21px;
    font-weight: bold;
    text-transform: uppercase;
    color: #111;
    margin-top: 12px;
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  /* ---- Body: photo (left) + fields (right) ---- */
  .body-row {
    display: flex;
    gap: 22px;
    flex: 1;
    min-height: 0;
  }

  .photo-col { width: 132px; flex-shrink: 0; }
  .photo-col img.photo {
    width: 132px;
    height: 168px;
    object-fit: cover;
    border-radius: 10px;
    border: 3px solid #1a7a3d;
  }

  .fields {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    position: relative;
  }
  .fields .row { display: flex; margin-bottom: 8px; }
  .fields .label { width: 78px; font-weight: bold; flex-shrink: 0; color: #7a2d1f; }
  .fields .value { flex: 1; color: #222; overflow-wrap: anywhere; }

  .qr-code {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 52px;
    height: 52px;
  }

  /* ---- Bottom banner: full width, horizontal ---- */
  .bottom-banner {
    flex-shrink: 0;
    background: #1a7a3d;
    color: #7a1f1f;
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 4px;
    padding: 9px 0;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="header">
        <img class="logo" src="{{MINISTRY_LOGO}}" alt="Ministry logo" />
        <div class="titles">
          <div class="ministry-line">
            MINISTRY OF EDUCATION STATE DEPARTMENT<br>
            FOR VOCATIONAL AND TECHNICAL TRAINING
          </div>
          <div class="college-name">
            NORTH HORR TECHNICAL &amp;<br>VOCATIONAL COLLEGE
          </div>
        </div>
        <img class="logo" src="{{SCHOOL_LOGO}}" alt="School seal" />
      </div>

      <div class="name">{{NAME}}</div>

      <div class="body-row">
        <div class="photo-col">
          <img class="photo" src="{{PHOTO}}" />
        </div>
        <div class="fields">
          <div class="row"><div class="label">Adm No:</div><div class="value">{{ADM_NO}}</div></div>
          <div class="row"><div class="label">Dept:</div><div class="value">{{DEPT}}</div></div>
          <div class="row"><div class="label">Course:</div><div class="value">{{COURSE}}</div></div>
          <div class="row"><div class="label">Gender:</div><div class="value">{{GENDER}}</div></div>
          <div class="row"><div class="label">ID No:</div><div class="value">{{ID_NO}}</div></div>
          <div class="row"><div class="label">Expiry:</div><div class="value">{{EXPIRY}}</div></div>
          <img class="qr-code" src="{{QR_CODE}}" />
        </div>
      </div>
    </div>

    <div class="bottom-banner">STUDENT IDENTIFICATION CARD</div>
  </div>
</body>
</html>
